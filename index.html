<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Attendance Suite</title>
<style>
:root {
--bg-dark: #09090b;
--card-dark: #121214;
--card-border: rgba(255, 255, 255, 0.08);
--text-main: #f8fafc;
--text-muted: #94a3b8;
--primary: #6366f1;
--primary-glow: rgba(99, 102, 241, 0.3);

--present: #10b981;
--present-bg: rgba(16, 185, 129, 0.1);
--absent: #ef4444;
--absent-bg: rgba(239, 68, 68, 0.1);
--pl: #3b82f6;
--pl-bg: rgba(59, 130, 246, 0.1);
--wo: #8b5cf6;
--wo-bg: rgba(139, 92, 246, 0.1);
--ot: #f59e0b;
--ot-bg: rgba(245, 158, 11, 0.1);
--hd: #06b6d4;
--hd-bg: rgba(6, 182, 212, 0.1);
--l: #ec4899;
--l-bg: rgba(236, 72, 153, 0.1);
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
-webkit-tap-highlight-color: transparent;
}

body {
background-color: var(--bg-dark);
color: var(--text-main);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: flex-start;
padding: 10px;
font-size: 16px;
overflow-x: hidden;
}

/* --- Auth UI --- */
#auth-section {
background: linear-gradient(145deg, var(--card-dark), #18181b);
padding: 2rem;
border-radius: 16px;
width: 100%;
max-width: 400px;
border: 1px solid var(--card-border);
margin-top: 10vh;
box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

#auth-section h2 {
margin-bottom: 1.5rem;
color: var(--text-main);
text-align: center;
font-weight: 700;
letter-spacing: -0.5px;
}

.input-group { margin-bottom: 1.2rem; }

.input-group input {
width: 100%;
padding: 14px;
border-radius: 10px;
background: rgba(0,0,0,0.3);
border: 1px solid var(--card-border);
color: var(--text-main);
outline: none;
font-size: 16px;
transition: all 0.3s ease;
}

.input-group input:focus {
border-color: var(--primary);
box-shadow: 0 0 12px var(--primary-glow);
}

.btn {
width: 100%;
padding: 14px;
border: none;
border-radius: 10px;
background: linear-gradient(135deg, var(--primary), #4f46e5);
color: white;
font-weight: 700;
cursor: pointer;
font-size: 1rem;
box-shadow: 0 4px 15px var(--primary-glow);
transition: transform 0.2s;
}

.btn:active { transform: scale(0.98); }

#error-msg {
color: var(--absent);
font-size: 0.85rem;
margin-top: 1rem;
text-align: center;
min-height: 20px;
font-weight: 600;
}

/* --- Dashboard UI --- */
#dashboard-section {
display: none;
background: var(--card-dark);
width: 100%;
max-width: 600px;
border-radius: 16px;
border: 1px solid var(--card-border);
padding: 12px;
margin-top: 2vh;
box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

.header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 1.2rem;
padding-bottom: 1rem;
border-bottom: 1px solid var(--card-border);
}

.header h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }

.logout-btn {
background: rgba(239, 68, 68, 0.1);
border: 1px solid rgba(239, 68, 68, 0.3);
color: var(--absent);
padding: 6px 12px;
border-radius: 8px;
font-weight: 700;
font-size: 0.85rem;
cursor: pointer;
}

/* --- Advanced Analytics Grid --- */
.analytics-grid {
display: grid;
grid-template-columns: 1fr; 
gap: 10px;
margin-bottom: 15px;
}

.analytic-card {
background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(255,255,255,0.05));
padding: 12px;
border-radius: 12px;
border: 1px solid var(--card-border);
text-align: center;
font-size: 0.8rem;
color: var(--text-muted);
font-weight: 600;
}

.analytic-card .value {
font-size: clamp(1.4rem, 5vw, 1.8rem);
font-weight: 800;
color: var(--primary);
margin-top: 4px;
text-shadow: 0 0 10px var(--primary-glow);
}

.stats-grid {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 6px;
margin-bottom: 1.2rem;
}

.stat-card {
flex: 1 1 22%;
min-width: 65px;
padding: 8px 2px;
border-radius: 8px;
text-align: center;
font-weight: 700;
font-size: 0.75rem;
border: 1px solid;
background: rgba(0,0,0,0.2);
}

.stat-card span { display: block; font-size: 1.2rem; margin-top: 0.2rem; }

.bg-p { color: var(--present); border-color: rgba(16, 185, 129, 0.3); }
.bg-a { color: var(--absent); border-color: rgba(239, 68, 68, 0.3); }
.bg-ot { color: var(--ot); border-color: rgba(245, 158, 11, 0.3); }
.bg-pl { color: var(--pl); border-color: rgba(59, 130, 246, 0.3); }
.bg-wo { color: var(--wo); border-color: rgba(139, 92, 246, 0.3); }
.bg-hd { color: var(--hd); border-color: rgba(6, 182, 212, 0.3); }
.bg-l { color: var(--l); border-color: rgba(236, 72, 153, 0.3); }

/* --- Calendar UI --- */
.calendar-actions {
display: flex;
justify-content: center;
align-items: center;
margin-top: 15px;
}

.export-btn {
background: linear-gradient(135deg, #10b981, #059669);
border: none;
color: white;
width: 100%;
padding: 12px 12px;
border-radius: 8px;
font-weight: 800;
font-size: 1rem;
cursor: pointer;
box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
transition: transform 0.2s;
}

.export-btn:active { transform: scale(0.95); }

.calendar-nav {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 1rem;
background: rgba(0,0,0,0.2);
padding: 5px;
border-radius: 10px;
border: 1px solid var(--card-border);
}

.calendar-nav button {
background: transparent;
border: none;
color: var(--text-main);
padding: 8px 12px;
border-radius: 6px;
font-weight: 800;
cursor: pointer;
}

.calendar-nav h2 { font-size: 1.1rem; font-weight: 800; margin: 0 10px;}

.calendar-header {
display: grid;
grid-template-columns: repeat(7, 1fr);
text-align: center;
font-weight: 800;
font-size: 0.8rem;
margin-bottom: 10px;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 0.5px;
}

.calendar-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 6px; 
width: 100%;
margin-bottom: 20px;
}

.day-box {
aspect-ratio: 1 / 1.25; 
width: 100%;
background: rgba(255,255,255,0.03);
border: 1px solid var(--card-border);
border-radius: 8px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
cursor: pointer;
transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
position: relative;
overflow: hidden;
}

.day-box:active:not(.empty) { transform: scale(0.9); }
.day-box.empty { background: transparent; border: none; cursor: default; }

.day-number { font-size: clamp(0.95rem, 4vw, 1.2rem); font-weight: 800; z-index: 1; }
.day-status { font-size: clamp(0.65rem, 2.5vw, 0.85rem); margin-top: 4px; font-weight: 800; z-index: 1; white-space: pre-line; line-height: 1.2; text-align: center; }

.status-P { border-color: var(--present); background: var(--present-bg); }
.status-P .day-status { color: var(--present); }
.status-A { border-color: var(--absent); background: var(--absent-bg); }
.status-A .day-status { color: var(--absent); }
.status-PL { border-color: var(--pl); background: var(--pl-bg); }
.status-PL .day-status { color: var(--pl); }
.status-WO { border-color: var(--wo); background: var(--wo-bg); }
.status-WO .day-status { color: var(--wo); }
.status-OT { border-color: var(--ot); background: var(--ot-bg); }
.status-OT .day-status { color: var(--ot); }
.status-HD { border-color: var(--hd); background: var(--hd-bg); }
.status-HD .day-status { color: var(--hd); }
.status-L { border-color: var(--l); background: var(--l-bg); }
.status-L .day-status { color: var(--l); }

/* --- Modal --- */
#status-modal {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
z-index: 2000; display: none; justify-content: center; align-items: flex-end; padding: 10px;
}

.modal-content {
background: var(--card-dark); padding: 20px; border-radius: 20px 20px 10px 10px;
width: 100%; max-width: 400px; border: 1px solid var(--card-border);
border-bottom: none; text-align: center; animation: slideUp 0.3s ease-out;
box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
}

@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-content h3 { margin-bottom: 1rem; font-weight: 800; }
.status-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.status-btn {
padding: 12px; border: none; border-radius: 10px; font-weight: 700;
font-size: 0.9rem; color: white; display: flex; align-items: center; justify-content: center;
cursor: pointer;
}

.btn-full { grid-column: span 2; }
.btn-p { background: var(--present); color: #000; }
.btn-a { background: var(--absent); }
.btn-ot { background: var(--ot); color: #000; }
.btn-pl { background: var(--pl); }
.btn-wo { background: var(--wo); }
.btn-hd { background: var(--hd); color: #000; }
.btn-l { background: var(--l); color: #000; }
.btn-none { background: rgba(255,255,255,0.1); color: var(--text-main); }

.close-modal-btn {
margin-top: 15px; padding: 12px; width: 100%; background: transparent;
border: 1px solid var(--card-border); color: var(--text-muted); border-radius: 10px; font-weight: 700;
cursor: pointer;
}

/* --- Loader --- */
#loading-overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(9, 9, 11, 0.9); backdrop-filter: blur(4px);
display: flex; justify-content: center; align-items: center;
z-index: 3000; display: none;
}
.loader {
border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary);
border-radius: 50%; width: 40px; height: 40px;
animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading-overlay"><div class="loader"></div></div>

<!-- Login -->
<div id="auth-section">
<h2>Attendance System</h2>
<div class="input-group">
<input type="email" id="email" placeholder="Email Address" required>
</div>
<div class="input-group">
<input type="password" id="password" placeholder="Password" required>
</div>
<button class="btn" id="login-btn">Secure Login</button>
<div id="error-msg"></div>
</div>

<!-- Dashboard -->
<div id="dashboard-section">
<div class="header">
<div>
<h1>Dashboard</h1>
<p id="user-email" style="color: var(--text-muted); font-size: 0.8rem;"></p>
</div>
<button class="logout-btn" id="logout-btn">Logout</button>
</div>

<!-- CALENDAR SECTION MOVED TOP -->
<div class="calendar-nav">
<button id="prev-month">◄ Prev</button>
<h2 id="monthYearDisplay"></h2>
<button id="next-month">Next ►</button>
</div>

<div class="calendar-header">
<div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
</div>

<div class="calendar-grid" id="calendar"></div>

<hr style="border: 0; border-top: 1px solid var(--card-border); margin: 15px 0;">

<!-- STATS & ANALYTICS MOVED BOTTOM -->
<div class="analytics-grid">
<!-- Payout units logically hidden but ID kept alive for JS -->
<div id="payout-calc" style="display: none;">0.0</div>
<div class="analytic-card">Monthly Efficiency<div class="value" id="efficiency">0%</div></div>
</div>

<div class="stats-grid">
<div class="stat-card bg-p">P <span id="count-P">0</span></div>
<div class="stat-card bg-a">A <span id="count-A">0</span></div>
<div class="stat-card bg-ot">OT <span id="count-OT">0</span></div>
<div class="stat-card bg-pl">PL <span id="count-PL">0</span></div>
<div class="stat-card bg-hd">HD <span id="count-HD">0</span></div>
<div class="stat-card bg-l">L <span id="count-L">0</span></div>
<div class="stat-card bg-wo">WO <span id="count-WO">0</span></div>
</div>

<div class="calendar-actions">
<!-- Backup/Export Button moved to bottom center -->
<button id="export-csv-btn" class="export-btn">⬇ Export Backup File</button>
</div>
</div>

<!-- Modal -->
<div id="status-modal">
<div class="modal-content">
<h3>Mark Status</h3>

<!-- Shift Selection Modifier -->
<div style="margin-bottom: 15px; text-align: left;">
    <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 5px;">Shift (Optional):</label>
    <select id="shift-select" style="width: 100%; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); color: var(--text-main); outline: none; font-size: 0.9rem; font-weight: 700;">
        <option value="General" selected>General Shift</option>
        <option value="Morning">Morning Shift</option>
        <option value="Afternoon">Afternoon Shift</option>
        <option value="Night">Night Shift</option>
    </select>
</div>

<div class="status-options">
<button class="status-btn btn-p" data-status="P">Present (P)</button>
<button class="status-btn btn-a" data-status="A">Absent (A)</button>
<!-- Modified OT Button -->
<button class="status-btn btn-ot" id="btn-ot-trigger">Overtime (OT)</button>
<button class="status-btn btn-pl" data-status="PL">Paid Leave (PL)</button>
<button class="status-btn btn-hd" data-status="HD">Half Day (HD)</button>
<button class="status-btn btn-l" data-status="L">Leave (L)</button>
<button class="status-btn btn-wo btn-full" data-status="WO">Weekly Off (WO)</button>
<button class="status-btn btn-none btn-full" data-status="None">Clear Entry</button>

<!-- Hidden OT Hours Container -->
<div id="ot-hours-container" class="btn-full" style="display: none; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; border: 1px solid var(--card-border); text-align: left;">
    <p style="margin-bottom: 10px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">Select Overtime Hours:</p>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button class="status-btn" style="flex: 1; background: var(--ot); color: #000;" id="btn-ot-4">4 Hours</button>
        <button class="status-btn" style="flex: 1; background: var(--ot); color: #000;" id="btn-ot-12">12 Hours</button>
    </div>
    <div style="display: flex; gap: 10px;">
        <input type="number" id="custom-ot-hours" placeholder="Custom Hrs" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.5); color: white; outline: none; font-weight: 600;">
        <button class="status-btn" style="background: var(--primary); color: white; padding: 10px 15px;" id="btn-ot-custom-save">Save OT</button>
    </div>
</div>
</div>
<button class="close-modal-btn" id="close-modal-btn">Cancel</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, enableIndexedDbPersistence, deleteField } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyD9hQAi3C2NAoS89TSi7Oeo1Dx5ZQ7B7nQ",
authDomain: "attendance-app-bb097.firebaseapp.com",
projectId: "attendance-app-bb097",
storageBucket: "attendance-app-bb097.firebasestorage.app",
messagingSenderId: "842641551073",
appId: "1:842641551073:web:c98db96af0307dce0991a0",
measurementId: "G-8QV5TY2KL2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

enableIndexedDbPersistence(db).catch((err) => {
console.warn("Offline persistence not enabled:", err.code);
});

let currentUser = null;
let currentDate = new Date();
let currentMonthData = {};
let activeSelectedDay = null;
let unsubscribeSnapshot = null;

const authSection = document.getElementById('auth-section');
const dashboardSection = document.getElementById('dashboard-section');
const loadingOverlay = document.getElementById('loading-overlay');
const statusModal = document.getElementById('status-modal');
const otContainer = document.getElementById('ot-hours-container');
const customOtInput = document.getElementById('custom-ot-hours');
const shiftSelect = document.getElementById('shift-select');

const showLoading = (show) => { loadingOverlay.style.display = show ? 'flex' : 'none'; };

onAuthStateChanged(auth, (user) => {
if (user) {
currentUser = user;
document.getElementById('user-email').innerText = user.email;
authSection.style.display = 'none';
dashboardSection.style.display = 'block';
setupRealtimeListener();
} else {
currentUser = null;
if(unsubscribeSnapshot) unsubscribeSnapshot();
authSection.style.display = 'block';
dashboardSection.style.display = 'none';
}
});

document.getElementById('login-btn').addEventListener('click', async () => {
const email = document.getElementById('email').value.trim();
const password = document.getElementById('password').value;
if(!email || !password) return;

showLoading(true);
try {
await signInWithEmailAndPassword(auth, email, password);
document.getElementById('error-msg').innerText = '';
} catch (error) {
document.getElementById('error-msg').innerText = "Authentication Failed. Check Details.";
}
showLoading(false);
});

document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

function setupRealtimeListener() {
if(!currentUser) return;
showLoading(true);

if(unsubscribeSnapshot) unsubscribeSnapshot();

const yearMonth = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
const docRef = doc(db, `users/${currentUser.uid}/attendance`, yearMonth);

unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
if (docSnap.exists()) {
currentMonthData = docSnap.data();
} else {
currentMonthData = {};
}
renderCalendar();
processAnalytics();
showLoading(false);
}, (error) => {
console.error("Realtime listener failed:", error);
alert("Database rules access denied or offline.");
showLoading(false);
});
}

async function saveDayData(day, status) {
if(!currentUser) return;
const yearMonth = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
const docRef = doc(db, `users/${currentUser.uid}/attendance`, yearMonth);

try {
    if(status === 'None') {
        const deletePayload = {};
        deletePayload[day] = deleteField();
        await setDoc(docRef, deletePayload, { merge: true });
        delete currentMonthData[day];
    } else {
        const updatePayload = {};
        updatePayload[day] = status;
        await setDoc(docRef, updatePayload, { merge: true });
    }
} catch(error) {
    alert("Failed to update system records. Check permissions.");
}
}

function renderCalendar() {
const calendar = document.getElementById('calendar');
const year = currentDate.getFullYear();
const month = currentDate.getMonth();

const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
document.getElementById('monthYearDisplay').innerText = `${monthNames[month]} ${year}`;

const firstDay = new Date(year, month, 1).getDay();
const daysInMonth = new Date(year, month + 1, 0).getDate();

calendar.innerHTML = '';

for (let i = 0; i < firstDay; i++) {
const emptyDiv = document.createElement('div');
emptyDiv.className = 'day-box empty';
calendar.appendChild(emptyDiv);
}

for (let i = 1; i <= daysInMonth; i++) {
const dbValue = currentMonthData[i];
const fullStatus = (dbValue === null || dbValue === undefined) ? 'None' : dbValue;

const rawStatus = fullStatus.split('|')[0];
const shiftText = fullStatus.includes('|') ? fullStatus.split('|')[1] : '';

let baseStatus = rawStatus;
let displayTxt = rawStatus !== 'None' ? rawStatus : '';

if(rawStatus.startsWith('OT-')) {
    baseStatus = 'OT';
    displayTxt = `OT\n${rawStatus.split('-')[1]}h`;
}

if (shiftText) {
    const shortShift = shiftText.substring(0,3).toUpperCase();
    displayTxt += `\n${shortShift}`;
}

const statusClass = baseStatus !== 'None' ? `status-${baseStatus}` : '';
const displayStatus = displayTxt;

const dayDiv = document.createElement('div');
dayDiv.className = `day-box ${statusClass}`;
dayDiv.innerHTML = `
<div class="day-number">${i}</div>
<div class="day-status">${displayStatus}</div>
`;

dayDiv.addEventListener('click', () => {
activeSelectedDay = i.toString();
statusModal.style.display = 'flex';
});

calendar.appendChild(dayDiv);
}
}

function processAnalytics() {
// Note: P count will be incremented for both Present and OT entries.
const counts = { P: 0, A: 0, OT: 0, PL: 0, WO: 0, HD: 0, L: 0 };
let totalUnits = 0;
let totalOTHours = 0;

for (let day in currentMonthData) {
const fullStatus = currentMonthData[day];
if (fullStatus === null || fullStatus === undefined || fullStatus === 'None') continue;

const rawStatus = fullStatus.split('|')[0];

let baseStatus = rawStatus;
let otHrs = 0;

if (rawStatus.startsWith('OT-')) {
    baseStatus = 'OT';
    otHrs = parseFloat(rawStatus.split('-')[1]) || 0;
    totalOTHours += otHrs;
}

// Ensure OT increments P as well
if (baseStatus === 'OT') {
    counts['P']++;
} else if (counts[baseStatus] !== undefined) {
    counts[baseStatus]++;
}

if(baseStatus === 'P' || baseStatus === 'PL') totalUnits += 1;
if(baseStatus === 'HD') totalUnits += 0.5;

// If it's an OT day, the base P unit has been counted implicitly if we assume base pay is there
if(baseStatus === 'OT') {
    totalUnits += 1; // The implicit "Present" base day
    totalUnits += (otHrs / 8); 
}
}

for (let key in counts) document.getElementById(`count-${key}`).innerText = counts[key];
document.getElementById(`count-OT`).innerText = totalOTHours > 0 ? `${totalOTHours}h` : counts.OT;

document.getElementById('payout-calc').innerText = totalUnits.toFixed(1);

let efficiencyRate = Math.round((totalUnits / 26) * 100);
if(efficiencyRate > 100) efficiencyRate = 100;
document.getElementById('efficiency').innerText = efficiencyRate + '%';
}

// CSV Export Logic
document.getElementById('export-csv-btn').addEventListener('click', () => {
if (!currentMonthData || Object.keys(currentMonthData).length === 0) {
alert("No data available to export for this month.");
return;
}

const year = currentDate.getFullYear();
const month = currentDate.getMonth() + 1;

let csvContent = "Date,Status\n";

const days = Object.keys(currentMonthData).map(Number).sort((a, b) => a - b);

days.forEach(day => {
const formattedDate = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
const dbValue = currentMonthData[day];
if (dbValue !== null && dbValue !== undefined) {
    const cleanStatus = dbValue.replace('|', ' - Shift: ');
    csvContent += `${formattedDate},${cleanStatus}\n`;
}
});

const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
const link = document.createElement("a");
const url = URL.createObjectURL(blob);

link.setAttribute("href", url);
link.setAttribute("download", `Attendance_Backup_${year}_${month}.csv`);
link.style.visibility = 'hidden';

document.body.appendChild(link);
link.click();
document.body.removeChild(link);
});

document.getElementById('prev-month').addEventListener('click', () => {
currentDate.setMonth(currentDate.getMonth() - 1);
setupRealtimeListener();
});

document.getElementById('next-month').addEventListener('click', () => {
currentDate.setMonth(currentDate.getMonth() + 1);
setupRealtimeListener();
});

document.getElementById('close-modal-btn').addEventListener('click', () => {
statusModal.style.display = 'none';
activeSelectedDay = null;
otContainer.style.display = 'none';
customOtInput.value = '';
shiftSelect.value = 'General';
});

// OT Specific Listeners
document.getElementById('btn-ot-trigger').addEventListener('click', (e) => {
e.preventDefault();
otContainer.style.display = otContainer.style.display === 'none' ? 'block' : 'none';
});

document.getElementById('btn-ot-4').addEventListener('click', () => saveOtAction('4'));
document.getElementById('btn-ot-12').addEventListener('click', () => saveOtAction('12'));
document.getElementById('btn-ot-custom-save').addEventListener('click', () => {
const val = customOtInput.value.trim();
if(val) saveOtAction(val);
});

function saveOtAction(hours) {
const shift = shiftSelect.value || 'General';
let finalStatus = 'OT-' + hours;
if(shift) finalStatus += '|' + shift;

if(activeSelectedDay) saveDayData(activeSelectedDay, finalStatus);

statusModal.style.display = 'none';
activeSelectedDay = null;
otContainer.style.display = 'none';
customOtInput.value = '';
shiftSelect.value = 'General';
}

// Ensure normal buttons save data safely WITH shift modifiers
document.querySelectorAll('.status-btn[data-status]').forEach(btn => {
btn.addEventListener('click', (e) => {
const selectedStatus = e.target.getAttribute('data-status');
const shift = shiftSelect.value || 'General';
let finalStatus = selectedStatus;

// Append shift if not clearing entry and not absent/leave
if (selectedStatus !== 'None' && selectedStatus !== 'A' && selectedStatus !== 'WO' && selectedStatus !== 'L') {
    finalStatus += '|' + shift;
}

if(activeSelectedDay) saveDayData(activeSelectedDay, finalStatus);

statusModal.style.display = 'none';
activeSelectedDay = null;
otContainer.style.display = 'none';
customOtInput.value = '';
shiftSelect.value = 'General';
});
});
</script>
</body>
